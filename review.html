<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Psycholistica — tryb uwag klienta</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f1ed; color: #27211e; }
        main { width: min(520px, calc(100% - 40px)); padding: 42px; border: 1px solid #ded8d1; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px rgba(39, 33, 30, .1); text-align: center; }
        strong { display: block; margin-bottom: 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 0 0 14px; font-family: Georgia, serif; font-size: 36px; font-weight: 500; }
        p { margin: 0 0 24px; color: #706760; line-height: 1.65; }
        a { display: inline-flex; padding: 14px 22px; border-radius: 999px; background: #27211e; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <strong>Psycholistica · Review Mode</strong>
        <h1>Otwieranie strony do przeglądu…</h1>
        <p>Jeśli strona nie otworzy się automatycznie, użyj przycisku poniżej.</p>
        <a id="review-entry-link" href="index.html?review=1">Otwórz tryb uwag</a>
    </main>
    <script>
        (() => {
            const target = new URL('index.html', window.location.href);
            target.searchParams.set('review', '1');
            document.getElementById('review-entry-link').href = target.href;
            window.location.replace(target.href);
        })();
    </script>
</body>
</html>
